<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消消乐</title>
<style>



 *{margin:0;padding:0;box-sizing:border-box}body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;user-select:none;-webkit-user-select:none}.game-container{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}.game-header{text-align:center;color:#fff}.game-header h1{font-size:28px;font-weight:700;margin-bottom:12px;letter-spacing:2px;background:linear-gradient(90deg,#ff6bd6,#ffb86c,#50fa7b,#8be9fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.score-board{display:flex;gap:24px;justify-content:center;margin-bottom:12px}.score-item{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,0.08);border-radius:10px;padding:8px 20px;min-width:80px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.1)}.score-label{font-size:11px;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:1px}.score-value{font-size:24px;font-weight:700;color:#f8f8f2;font-variant-numeric:tabular-nums}.score-value.combo{color:#ffb86c}.btn-new-game{background:linear-gradient(135deg,#ff6bd6,#c44dff);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.5px;transition:transform 0.15s,box-shadow 0.15s;box-shadow:0 4px 15px rgba(196,77,255,0.35)}.btn-new-game:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(196,77,255,0.5)}.btn-new-game:active{transform:translateY(0)}.board-wrapper{background:rgba(255,255,255,0.05);border-radius:16px;padding:8px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 8px 32px rgba(0,0,0,0.3)}.board{display:grid;grid-template-columns:repeat(8,60px);grid-template-rows:repeat(8,60px);gap:3px}.cell{width:60px;height:60px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.12s ease,opacity 0.2s ease;position:relative}.cell:hover{transform:scale(1.05);z-index:1}.cell::after{content:"";position:absolute;inset:3px;border-radius:5px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.3),transparent 60%);pointer-events:none}.cell .gem{font-size:30px;z-index:1;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3))}.cell.selected{animation:pulse 0.6s ease-in-out infinite;box-shadow:0 0 0 3px #fff,0 0 20px rgba(255,255,255,0.5);z-index:2}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.cell.matched{animation:pop 0.3s ease-out forwards}@keyframes pop{0%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:0.6}100%{transform:scale(0);opacity:0}}.cell.drop{animation:dropIn var(--drop-dur,.5s) cubic-bezier(.34,1.56,.64,1) both;will-change:transform}.cell.slide{animation:slideIn var(--slide-dur,.35s) cubic-bezier(.25,.46,.45,.94) both;will-change:transform}@keyframes dropIn{0%{transform:translateY(var(--drop-dist,-120px));opacity:0}50%{opacity:1}100%{transform:translateY(0);opacity:1}}@keyframes slideIn{0%{transform:translateY(var(--slide-dist,-60px))}100%{transform:translateY(0)}}.cell.swap{transition:transform 0.2s cubic-bezier(0.25,0.46,0.45,0.94)}.game-footer{margin-top:4px}.hint{color:rgba(255,255,255,0.4);font-size:13px}.gem-0{background:linear-gradient(135deg,#ff6b6b,#ee5a24)}.gem-1{background:linear-gradient(135deg,#48dbfb,#0abde3)}.gem-2{background:linear-gradient(135deg,#ff9ff3,#f368e0)}.gem-3{background:linear-gradient(135deg,#feca57,#ff9f43)}.gem-4{background:linear-gradient(135deg,#55efc4,#00b894)}.gem-5{background:linear-gradient(135deg,#a29bfe,#6c5ce7)}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media (max-width:540px){.board{grid-template-columns:repeat(8,40px);grid-template-rows:repeat(8,40px);gap:2px}.cell{width:40px;height:40px;border-radius:5px}.cell .gem{font-size:20px}.game-header h1{font-size:22px}.score-value{font-size:20px}.score-item{min-width:60px;padding:6px 12px}}
 </style>
</head>
<body>
<div class="game-container">
  <header class="game-header">
    <h1>消消乐</h1>
    <div class="score-board">
      <div class="score-item">
        <span class="score-label">分数</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">最高连击</span>
        <span class="score-value combo" id="combo">x1</span>
      </div>
      <div class="score-item">
        <span class="score-label">最高分</span>
        <span class="score-value" id="highScore">0</span>
      </div>
    </div>
    <button class="btn-new-game" id="newGameBtn">新游戏</button>
  </header>
  <div class="board-wrapper">
    <div class="board" id="board"></div>
  </div>
  <div class="game-footer">
    <p class="hint">点击一颗宝石选中，再点击相邻宝石交换</p>
  </div>
</div>
<script>
const ROWS=8,COLS=8,GEM_TYPES=6;
const GEM_ICONS=["\ud83d\udc8e","\ud83d\udd2e","\u2b50","\ud83d\udd25","\u2744","\ud83e\udd8b"];
let board=[],selectedRow=-1,selectedCol=-1,score=0,combo=0,highScore=0,maxCombo=0,isProcessing=!1,gravityMoves=[],newDrops=[];
const boardEl=document.getElementById("board"),scoreEl=document.getElementById("score"),comboEl=document.getElementById("combo"),highScoreEl=document.getElementById("highScore");
async function init(){loadHighScore();createBoard();renderBoard();bindEvents()}
function createBoard(){board=[];for(let e=0;e<ROWS;e++){board[e]=[];for(let t=0;t<COLS;t++)board[e][t]=randomGem(e,t)}for(;findAllMatches().size>0;)for(let r of findAllMatches()){let[e,t]=r.split(",").map(Number);board[e][t]=randomGem(e,t)}score=0;combo=0;maxCombo=0;selectedRow=-1;selectedCol=-1;updateUI()}
function randomGem(e,t){let r=new Set;e>=2&&board[e-1]&&board[e-2]&&board[e-1][t]===board[e-2][t]&&r.add(board[e-1][t]);let o=[];for(let n=0;n<GEM_TYPES;n++)r.has(n)||o.push(n);return 0===o.length?Math.floor(Math.random()*GEM_TYPES):o[Math.floor(Math.random()*o.length)]}
function renderBoard(){boardEl.innerHTML="";for(let e=0;e<ROWS;e++)for(let t=0;t<COLS;t++){let r=document.createElement("div");r.className="cell gem-"+board[e][t];r.dataset.row=e;r.dataset.col=t;let o=document.createElement("span");o.className="gem";o.textContent=GEM_ICONS[board[e][t]];r.appendChild(o);boardEl.appendChild(r)}if(selectedRow>=0&&selectedCol>=0){let e=boardEl.querySelector('[data-row=\"'+selectedRow+'\"][data-col=\"'+selectedCol+'\"]');e&&e.classList.add("selected")}}
function bindEvents(){boardEl.addEventListener("click",function(e){if(isProcessing)return;let t=e.target.closest(".cell");if(!t)return;let r=parseInt(t.dataset.row),o=parseInt(t.dataset.col);handleCellClick(r,o)});document.getElementById("newGameBtn").addEventListener("click",function(){isProcessing||(createBoard(),renderBoard())})}
function handleCellClick(e,t){if(-1===selectedRow){selectedRow=e;selectedCol=t;renderBoard();return}if(selectedRow===e&&selectedCol===t){selectedRow=-1;selectedCol=-1;renderBoard();return}let r=Math.abs(e-selectedRow),o=Math.abs(t-selectedCol);if(1===r&&0===o||0===r&&1===o){let sr=selectedRow,sc=selectedCol;selectedRow=-1;selectedCol=-1;trySwap(sr,sc,e,t)}else{selectedRow=e;selectedCol=t;renderBoard()}}
async function trySwap(e,t,r,o){isProcessing=!0;let a=board[e][t],b=board[r][o];board[e][t]=b;board[r][o]=a;renderBoard();if(0===findAllMatches().size){await sleep(250);board[e][t]=a;board[r][o]=b;renderBoard();shakeCells(e,t,r,o);isProcessing=!1;return}combo=0;await processMatches();isProcessing=!1}
function rAF(){return new Promise(function(e){requestAnimationFrame(e)})}
async function processMatches(){for(let r=findAllMatches();r.size>0;){combo++;if(maxCombo<combo)maxCombo=combo;let o=r.size*10*combo;score+=o;updateUI();await animateMatches(r);removeMatched(r);applyGravity();fillEmpty();renderBoard();await rAF();await rAF();animateSlides();animateDrops();await sleep(500);r=findAllMatches()}combo=0;updateUI();if(score>highScore){highScore=score;saveHighScore(score);updateUI()}}
function findAllMatches(){let e=new Set;for(let t=0;t<ROWS;t++)for(let r=0;r<COLS-2;){if(-1!==board[t][r]){let o=1;for(;r+o<COLS&&board[t][r+o]===board[t][r];)o++;if(o>=3)for(let n=0;n<o;n++)e.add(t+','+(r+n));r+=o-1}r++}for(let t=0;t<COLS;t++)for(let r=0;r<ROWS-2;){if(-1!==board[r][t]){let o=1;for(;r+o<ROWS&&board[r+o][t]===board[r][t];)o++;if(o>=3)for(let n=0;n<o;n++)e.add((r+n)+','+t);r+=o-1}r++}return e}
function animateMatches(e){return new Promise(function(t){for(let r of e){let[o,n]=r.split(",").map(Number),a=boardEl.querySelector('[data-row=\"'+o+'\"][data-col=\"'+n+'\"]');a&&a.classList.add("matched")}setTimeout(t,300)})}
function removeMatched(e){for(let t of e){let[r,o]=t.split(",").map(Number);board[r][o]=-1}}
function applyGravity(){gravityMoves=[];for(let e=0;e<COLS;e++){let t=ROWS-1;for(let r=ROWS-1;r>=0;r--){if(-1!==board[r][e]){if(r!==t)gravityMoves.push({r:t,c:e,f:r});board[t][e]=board[r][e];t--}}for(let r=t;r>=0;r--)board[r][e]=-1}}
function fillEmpty(){newDrops=[];for(let e=0;e<COLS;e++){let t=0;for(let r=0;r<ROWS;r++)if(-1===board[r][e])t++;let o=t;for(let r=0;r<ROWS;r++)if(-1===board[r][e]){board[r][e]=Math.floor(Math.random()*GEM_TYPES);newDrops.push({r:r,c:e,d:o*63});o--}}}
function animateSlides(){for(let e of gravityMoves){let t=document.querySelector('[data-row=\"'+e.r+'\"][data-col=\"'+e.c+'\"]');if(t){let r=(e.r-e.f)*63;t.style.setProperty('--slide-dist','-'+r+'px');t.style.setProperty('--slide-dur',(0.25+Math.random()*0.1).toFixed(2)+'s');t.classList.add('slide')}}}
function animateDrops(){for(let e of newDrops){let t=document.querySelector('[data-row=\"'+e.r+'\"][data-col=\"'+e.c+'\"]');if(t){t.style.setProperty('--drop-dist','-'+e.d+'px');t.style.setProperty('--drop-dur',(0.35+Math.random()*0.15).toFixed(2)+'s');t.classList.add('drop')}}}
function shakeCells(e,t,r,o){let n=boardEl.querySelector('[data-row=\"'+e+'\"][data-col=\"'+t+'\"]'),a=boardEl.querySelector('[data-row=\"'+r+'\"][data-col=\"'+o+'\"]');[n,a].forEach(function(e){e&&(e.style.animation="shake 0.3s ease",e.addEventListener("animationend",function(){e.style.animation=""},{once:!0}))})}
function updateUI(){scoreEl.textContent=score;comboEl.textContent='x'+(0<combo?combo:maxCombo||1);highScoreEl.textContent=highScore}
function sleep(e){return new Promise(function(t){setTimeout(t,e)})}
function loadHighScore(){let e=localStorage.getItem("match3_highscore");if(e){let t=JSON.parse(e);highScore=t.high_score||0}updateUI();fetchHighScoreFromServer()}
async function fetchHighScoreFromServer(){try{let e=new AbortController;setTimeout(function(){e.abort()},2000);let t=await fetch("/api/highscore",{signal:e.signal}),r=await t.json();if(r.high_score>highScore){highScore=r.high_score;localStorage.setItem("match3_highscore",JSON.stringify({high_score:highScore}));updateUI()}}catch(e){}}
async function saveHighScore(e){localStorage.setItem("match3_highscore",JSON.stringify({high_score:e}));try{let t=new AbortController;setTimeout(function(){t.abort()},2000);await fetch("/api/highscore",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({score:e}),signal:t.signal})}catch(e){}}
init();
</script>
</body>
</html>
